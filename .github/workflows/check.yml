name: Extension checks
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint:firefox
      - run: git diff --exit-code -- extension/manifest.json extension/icons
      - uses: actions/upload-artifact@v4
        with:
          name: stripper-browser-packages
          path: dist/*.zip
